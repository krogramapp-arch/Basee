<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KroXray</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-badge">KX</div>
          <div class="brand-copy">
            <h1>KroXray</h1>
            <p>اتصالك، بإدارتك</p>
          </div>
        </div>
        <span class="plan-pill">مجاني</span>
      </header>

      <main class="phone-frame">
        <section class="connection-panel">
          <div class="status-row">
            <span class="status-dot"></span>
            <span class="status-text">غير متصل</span>
            <span class="vpn-tag">VPN</span>
          </div>

          <div class="server-block">
            <label>الخادم المحدد</label>
            <h2>أضف ملف اتصال للبدء</h2>
          </div>

          <button class="connect-btn">اتصال</button>
          <p class="info-text">لن يبدأ التطبيق نفقاً غير مكتمل أو يغيّر مسار اتصالك.</p>
        </section>

        <section class="profiles-box">
          <div class="section-header">
            <h3>ملفات الاتصال</h3>
            <span>0</span>
          </div>

          <div class="action-row">
            <button class="secondary-btn">+ لصق رابط</button>
            <button class="danger-btn">استيراد ملف</button>
          </div>

          <div class="profile-list">
            <div class="empty-state">لا توجد ملفات بعد</div>
          </div>
        </section>
      </main>

      <footer>تُحفظ الإعدادات على هذا الجهاز فقط.</footer>
    </div>
  </body>
</html>
